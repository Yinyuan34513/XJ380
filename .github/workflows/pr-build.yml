name: PR Build Check

on:
  pull_request:
    branches:
      - "**"
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:

concurrency:
  group: pr-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ninja-build:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            lld \
            nasm \
            ninja-build \
            curl \
            mtools \
            dosfstools \
            gdisk \
            qemu-system-x86 \
            qemu-utils \
            xorriso \
            python3-venv \
            gcc-mingw-w64-x86-64
          python3 -m venv .venv
          . .venv/bin/activate
          python3 -m pip install --upgrade pip
          python3 -m pip install kconfiglib
          rustup target add x86_64-unknown-none
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Resolve clang builtins path
        id: builtins
        shell: bash
        run: |
          set -euo pipefail
          path=""
          runtime_dir="$(clang --print-runtime-dir 2>/dev/null || true)"
          if [[ -n "${runtime_dir}" && -f "${runtime_dir}/libclang_rt.builtins-x86_64.a" ]]; then
            path="${runtime_dir}/libclang_rt.builtins-x86_64.a"
          else
            path="$(find /usr/lib/clang -type f -name 'libclang_rt.builtins-x86_64.a' | sort -V | tail -n 1 || true)"
          fi

          if [[ -z "${path}" || ! -f "${path}" ]]; then
            echo "Cannot find libclang_rt.builtins-x86_64.a"
            exit 1
          fi

          echo "path=${path}" >> "${GITHUB_OUTPUT}"

      - name: Generate Ninja graph
        run: |
          python3 tools/gen_ninja.py --out build.ninja

      - name: Check bootstrap tools
        run: |
          BROWSER_BUILTINS="${{ steps.builtins.outputs.path }}" ninja -f build.ninja check.tools

      - name: Build
        run: |
          BROWSER_BUILTINS="${{ steps.builtins.outputs.path }}" ninja -f build.ninja -j"$(nproc)" all
